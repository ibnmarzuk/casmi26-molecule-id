[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "casmi26"
version = "0.1.0"
description = "Enveda CASMI 2026 — molecule identification from LC-MS/MS spectra"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=14.0",
  "tqdm>=4.66",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
chem = ["rdkit>=2023.9.1"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
